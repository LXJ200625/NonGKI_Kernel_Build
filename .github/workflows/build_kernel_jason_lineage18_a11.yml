name: Build Kernel for Jason (LineageOS 18)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Profiles/jason_lineage18_a11.env'
    branches: [ "main" ]

env:
  PROFILE_NAME: "jason_lineage18_a11.env"
  PYTHON_VERSION: 3
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "main"
  HOOK_METHOD: "normal"
  KERNELSU_SUS_PATCH: false
  KPM_ENABLE: false
  GENERATE_DTB: false
  BUILD_DEBUGGER: true
  BUILD_OTHER_CONFIG: false
  FREE_MORE_SPACE: false

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Configuration
      run: |
        CONFIG_FILE="Profiles/${{ env.PROFILE_NAME }}"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "❌ Configuration file $CONFIG_FILE not found!"
          exit 1
        fi
        
        CONFIG_LIST=(
          DEVICE_NAME DEVICE_CODENAME CUSTOM_CMDS EXTRA_CMDS
          KERNEL_SOURCE KERNEL_BRANCH CLANG_SOURCE CLANG_BRANCH
          GCC_GNU GCC_64_SOURCE GCC_64_BRANCH GCC_32_SOURCE GCC_32_BRANCH
          TOOLCHAIN_SOURCE TOOLCHAIN_BRANCH DEFCONFIG_SOURCE DEFCONFIG_NAME
          KERNELSU_SOURCE KERNELSU_BRANCH KERNELSU_NAME SUSFS_ENABLE SUSFS_FIXED
          AK3_SOURCE AK3_BRANCH BOOT_SOURCE LXC_ENABLE HAVE_NO_DTBO
          HAVE_NO_DTBO_TOOL ROM_TEXT
        )
        
        for config in "${CONFIG_LIST[@]}"; do
          value=$(grep "^$config=" "$CONFIG_FILE" | cut -d '=' -f2- | tr -d '\r' | sed 's/^"\(.*\)"$/\1/')
          if [ -n "$value" ]; then
            echo "$config=$value" >> $GITHUB_ENV
          fi
        done

    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git make python3 bc build-essential zip curl wget \
          libssl-dev libelf-dev device-tree-compiler flex bison

    - name: Get Kernel Source
      run: |
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} kernel_source
        cd kernel_source
        echo "KERNEL_VERSION=$(grep -E '^VERSION|^PATCHLEVEL' Makefile | head -2 | cut -d' ' -f3 | tr '\n' '.' | sed 's/\.$//')" >> $GITHUB_ENV
        cd ..

    - name: Setup Toolchain
      run: |
        if [ "${{ env.GCC_GNU }}" = "true" ]; then
          git clone ${{ env.GCC_64_SOURCE }} -b ${{ env.GCC_64_BRANCH }} gcc64
          git clone ${{ env.GCC_32_SOURCE }} -b ${{ env.GCC_32_BRANCH }} gcc32
        else
          git clone ${{ env.CLANG_SOURCE }} -b ${{ env.CLANG_BRANCH }} clang
        fi

    - name: Apply KernelSU
      run: |
        cd kernel_source
        if [ "${{ env.KERNELSU_SOURCE }}" = "setup.sh" ]; then
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ env.KERNELSU_BRANCH }}
        else
          git clone ${{ env.KERNELSU_SOURCE }} -b ${{ env.KERNELSU_BRANCH }} KernelSU
        fi

    - name: Build Kernel
      run: |
        cd kernel_source
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 设置编译链
        if [ "${{ env.GCC_GNU }}" = "true" ]; then
          export PATH="$(pwd)/../gcc64/bin:$(pwd)/../gcc32/bin:${PATH}"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        else
          export PATH="$(pwd)/../clang/bin:${PATH}"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
        fi
        
        # 应用自定义命令
        eval ${{ env.CUSTOM_CMDS }}
        eval ${{ env.EXTRA_CMDS }}
        
        # 配置和编译
        make ${{ env.DEFCONFIG_NAME }}
        make -j$(nproc --all)

    - name: Package Kernel
      run: |
        git clone ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} anykernel3
        cp kernel_source/arch/arm64/boot/Image.gz-dtb anykernel3/
        cd anykernel3
        zip -r ../kernel_jason_los18.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Jason-LOS18
        path: kernel_jason_los18.zip
